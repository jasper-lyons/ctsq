# Text a user reads in JSX: the text between tags. The key is the text with its
# surrounding whitespace dropped, the target is the component or function that
# renders it. Text made only of whitespace is skipped.
framework = "jsx-text"
langs     = ["tsx", "js"]

[text]
# Also string literals and template strings with no substitution inside a
# {expression} between tags: directly, as a ternary branch or as an operand of a
# binary expression. Strings in attributes are not here, `label` finds those.
match  = [
  "(jsx_text#/\\S/ @key)",
  "(jsx_element > (jsx_expression > (string @key)))",
  "(jsx_element > (jsx_expression > (template_string#/^`[^$]*`$/ @key)))",
  "(jsx_element > (jsx_expression > (ternary_expression > (string @key))))",
  "(jsx_element > (jsx_expression > (ternary_expression > (template_string#/^`[^$]*`$/ @key))))",
  "(jsx_element > (jsx_expression > (ternary_expression > (ternary_expression > (string @key)))))",
  "(jsx_element > (jsx_expression > (ternary_expression > (ternary_expression > (template_string#/^`[^$]*`$/ @key)))))",
  "(jsx_element > (jsx_expression > (binary_expression > (string @key))))",
  "(jsx_element > (jsx_expression > (binary_expression > (template_string#/^`[^$]*`$/ @key))))",
]
target = "enclosing"
