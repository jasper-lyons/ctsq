# Error messages in Go: errors.New("...") and fmt.Errorf("..."). The key is the
# message as written, so an Errorf key keeps its %s and %w, and a message copied
# from a log still finds it (find matches those verbs as wildcards). The target
# is the function that emits the error, or (top level) for a package variable.
framework = "go-error"
langs     = ["go"]

[error]
match = [
  # errors.New("pipeline is empty")
  "(call_expression.function(selector_expression.operand(identifier#errors).field(field_identifier#New)) > (argument_list > (interpreted_string_literal @key)))",
  # fmt.Errorf("failed to load %s: %w", id, err)
  "(call_expression.function(selector_expression.operand(identifier#fmt).field(field_identifier#Errorf)) > (argument_list > (interpreted_string_literal @key)))",
  # errors.New(`raw message`)
  "(call_expression.function(selector_expression.operand(identifier#errors).field(field_identifier#New)) > (argument_list > (raw_string_literal @key)))",
  # fmt.Errorf(`raw %s`, x)
  "(call_expression.function(selector_expression.operand(identifier#fmt).field(field_identifier#Errorf)) > (argument_list > (raw_string_literal @key)))",
]
target = "enclosing"

# How a message the user pasted finds this error. The substring test sees the
# key with \" as ", and each placeholder below becomes a wildcard, so a message
# copied from a log (verbs filled in) finds its format string anywhere in the
# pasted line. All three placeholder forms apply in every language, as before.
# A key with under four literal characters is too loose for the pattern test.
key_text        = [['\\"', '"']]
key_pattern     = [
  ['%[+#\-]?\d*(?:\.\d+)?[svdwqxfTtgep]', '.*?'],  # Go and printf verbs: %s %w %+v %.2f
  ['\$\{[^}]*\}', '.*?'],                         # JS template: ${name}
  ['#\{[^}]*\}', '.*?'],                          # Ruby interpolation: #{name}
]
key_match       = "within"
key_min_literal = 4
