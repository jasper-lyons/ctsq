# Next.js app router: every app/**/page file is a route. The key comes from the
# directory path (route groups written (name) are not part of the URL and are
# dropped, [id] segments stay as written). The target is the page's default
# export, or the file name when that export is anonymous.
framework = "next-app"
langs     = ["tsx", "ts", "jsx", "js"]
detect    = { file = ["app/layout.tsx", "app/layout.jsx", "app/layout.ts", "app/layout.js"] }

[route]
paths         = "app/**/page.{tsx,jsx,ts,js}"
key_from_path = "^app(/.*)?/page\\.\\w+$"
target        = "default-export"

# A pasted URL finds its route: key_input drops the scheme and host, the query
# and fragment, and a trailing slash. Each route's path becomes a pattern.
key_input = [
  ['^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]*', ''],  # scheme and host
  ['[?#].*$', ''],                           # query and fragment
  ['(.)/$', '$1'],                           # a trailing slash, not a lone one
  ['^$', '/'],
]
key_pattern = [
  ['/\[\[\.\.\.([^\]/]+)\]\]', '(?:/(?P<$1>.+))?'],  # [[...name]] an optional rest
  ['\[\.\.\.([^\]/]+)\]', '(?P<$1>.+)'],             # [...name] the rest
  ['\[([^\]/]+)\]', '(?P<$1>[^/]+)'],                # [name] one segment, [user-id] too
  ['/', '/'],                            # a slash is not a literal character
]
key_min_literal = 1                      # so a catch-all ([...all]) is not tested
