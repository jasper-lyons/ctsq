# Routes registered on a net/http mux: mux.HandleFunc("/x", h), http.Handle(...)
# and the Go 1.22 form mux.HandleFunc("GET /x", h), whose key keeps the method.
# The key is the pattern string, the target is the handler, resolved with def.
# A method value h.Method gives Method. A wrapper call such as
# h.authed(h.logout) gives the handler inside it.
framework = "net-http"
langs     = ["go"]
detect    = { import = ["net/http"] }

[route]
match = [
  # mux.HandleFunc("GET /x", h.handler)
  "(call_expression.function(selector_expression.field(field_identifier#/^(HandleFunc|Handle)$/)) > (argument_list > (interpreted_string_literal @key) + (selector_expression.field(@target))))",
  # http.HandleFunc("/x", handler)
  "(call_expression.function(selector_expression.field(field_identifier#/^(HandleFunc|Handle)$/)) > (argument_list > (interpreted_string_literal @key) + (identifier @target)))",
  # mux.HandleFunc("GET /x", h.authed(h.handler))
  "(call_expression.function(selector_expression.field(field_identifier#/^(HandleFunc|Handle)$/)) > (argument_list > (interpreted_string_literal @key) + (call_expression > (argument_list > (selector_expression.field(@target))))))",
]
target = "def"

# A pasted URL finds its route, with or without a method in front: key_input
# drops the scheme and host (keeping a leading METHOD), the query and fragment,
# and a trailing slash. A pasted method must equal the route's, a route with no
# method takes any. A pattern ending in / takes everything below it.
key_input = [
  ['^([A-Z]+ )?[a-zA-Z][a-zA-Z0-9+.-]*://[^/]*', '$1'],  # scheme and host
  ['[?#].*$', ''],                                       # query and fragment
  ['(.)/$', '$1'],                                       # a trailing slash, not a lone one
  ['^([A-Z]+ )?$', '${1}/'],
]
key_pattern = [
  ['^(GET|HEAD|POST|PUT|PATCH|DELETE|CONNECT|OPTIONS|TRACE) ', '(?:$1 )?'],  # METHOD, optional when pasted
  ['^/', '(?:[A-Z]+ )?/'],               # no method: any method
  ['/\{\$\}$', '/?'],                    # {$} the path ends here
  ['\{(\w+)\.\.\.\}', '(?P<$1>.*)'],     # {name...} the rest
  ['\{(\w+)\}', '(?P<$1>[^/]+)'],        # {name} one segment
  ['/$', '(?:/.*)?'],                    # a trailing / takes the subtree
  ['/', '/'],                            # a slash is not a literal character
]
key_min_literal = 1                      # so a catch-all (*, /*, /) is not tested
