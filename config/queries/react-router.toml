# Routes declared with React Router: route objects (createBrowserRouter,
# useRoutes) and <Route> JSX. The key is the path string, the target is the
# element's component, resolved with def. A match whose node kinds a grammar
# lacks (JSX in plain .ts files) is skipped for that grammar.
framework = "react-router"
langs     = ["tsx", "ts", "jsx", "js"]
detect    = { import = ["react-router", "react-router-dom"] }

[route]
match = [
  # { path: "/about", element: <About /> }
  "(pair.key(property_identifier#path).value(string @key)) ~ (pair.key(property_identifier#element).value(jsx_self_closing_element.name(@target)))",
  # { path: "/about", element: <Layout>...</Layout> }
  "(pair.key(property_identifier#path).value(string @key)) ~ (pair.key(property_identifier#element).value(jsx_element.open_tag(jsx_opening_element.name(@target))))",
  # { path: "/about", Component: About }
  "(pair.key(property_identifier#path).value(string @key)) ~ (pair.key(property_identifier#Component).value(identifier @target))",
  # <Route path="/about" element={<About />} />
  "(jsx_attribute > (property_identifier#path) + (string @key)) ~ (jsx_attribute > (property_identifier#element) + (jsx_expression > jsx_self_closing_element.name(@target)))",
  # <Route path="/about" Component={About} />
  "(jsx_attribute > (property_identifier#path) + (string @key)) ~ (jsx_attribute > (property_identifier#Component) + (jsx_expression > (identifier @target)))",
]
target = "def"
