# Go flow mechanics. Each key lists tree-sitter node kinds.
[outside]
module_file = "go.mod"

[nodes]
assign    = ["short_var_declaration", "assignment_statement", "var_spec"]
call      = ["call_expression"]
return    = ["return_statement"]
field     = ["selector_expression"]
param     = ["parameter_declaration"]
import    = ["import_spec"]
branch    = ["if_statement", "expression_switch_statement", "type_switch_statement", "select_statement"]
loop      = ["for_statement"]
assert    = ["type_assertion_expression"]
composite = ["composite_literal"]
function  = ["function_declaration", "method_declaration", "func_literal"]
block     = ["block", "statement_list"]
case      = ["expression_case", "default_case", "type_case", "communication_case"]
default_case = ["default_case"]
name      = ["identifier"]
field_name = ["field_identifier"]
field_decl = ["field_declaration"]
type_decl = ["type_spec"]
range     = ["range_clause"]
list      = ["expression_list"]
loop_clause = ["for_clause"]
index     = ["index_expression"]
send      = ["send_statement"]
global    = ["var_declaration"]
map_type  = ["map_type"]
keyed     = ["keyed_element"]
element   = ["literal_element"]
conversion = ["type_conversion_expression"]
generic   = ["generic_type"]

# Child field names the flow engine reads.
[fields]
left        = ["left", "name"]
right       = ["right", "value"]
operator    = ["operator"]
condition   = ["condition", "value"]
initializer = ["initializer"]
update      = ["update"]
consequence = ["consequence"]
alternative = ["alternative"]
body        = ["body"]
alias       = ["alias"]
case_label  = ["value", "type", "communication"]
function    = ["function"]
arguments   = ["arguments"]
operand     = ["operand"]
field       = ["field"]
name        = ["name"]
type        = ["type"]
tag         = ["tag"]
key         = ["key"]
value       = ["value"]
channel     = ["channel"]

[tokens]
plain_assign = ["=", ":="]
blank        = ["_"]
