# Go template flow mechanics (text/template and html/template).
# Each key lists tree-sitter node kinds of the vendored grammar.
[nodes]
# `{{$x := .A}}` declares, `{{$x = .B}}` assigns.
assign    = ["variable_definition", "assignment"]
declare   = ["variable_definition"]
# Template function calls such as printf, and method calls such as .M arg.
call      = ["function_call", "method_call"]
# `.Name` is a field of dot, `.A.B` a selector on a field.
field     = ["field", "selector_expression"]
field_name = ["identifier", "field_identifier"]
# `$x` names.
name      = ["variable"]
# `if` and `with` take a condition and two arms. `with` also rebinds dot.
branch    = ["if_action", "with_action"]
# `range` rebinds dot to each element.
loop      = ["range_action"]
range     = ["range_variable_definition"]
# `define` and `block` bodies are what a template call runs.
function  = ["define_action", "block_action"]
# The file root holds the top-level actions in order.
block     = ["template"]
composite = ["parenthesized_pipeline"]

# Node kinds with no Mechanics key yet, listed for templates-flow:
#   dot           = ["dot"]
#   rebind        = ["range_action", "with_action"]
#   template_call = ["template_action", "block_action"]
#   define        = ["define_action", "block_action"]
#   pipeline      = ["chained_pipeline"]
#   print         = ["pipeline_action"]
#   argument (field) = ["argument"] on template_action and block_action

[fields]
left        = ["variable"]
right       = ["value"]
condition   = ["condition"]
consequence = ["consequence"]
alternative = ["alternative"]
body        = ["body"]
function    = ["function", "method"]
arguments   = ["arguments"]
operand     = ["operand"]
field       = ["field", "name"]
name        = ["name"]
value       = ["value"]

[tokens]
plain_assign = ["=", ":="]
declare      = [":="]
