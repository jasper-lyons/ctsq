# JavaScript flow mechanics, JSX included. Each key lists tree-sitter node kinds.
[nodes]
assign    = ["variable_declarator", "assignment_expression", "augmented_assignment_expression"]
call      = ["call_expression", "new_expression"]
return    = ["return_statement"]
field     = ["member_expression"]
# JS has no per-parameter wrapper node: the list itself, see flow::ts_sig.
param     = ["formal_parameters"]
import    = ["import_statement"]
branch    = ["if_statement", "switch_statement", "ternary_expression"]
loop      = ["for_statement", "for_in_statement", "while_statement", "do_statement"]
function  = ["function_declaration", "function_expression", "arrow_function", "method_definition", "generator_function_declaration", "generator_function"]
block     = ["statement_block"]
case      = ["switch_case", "switch_default"]
default_case = ["switch_default"]
name      = ["identifier"]
field_name = ["property_identifier"]
field_decl = ["field_definition"]
type_decl = ["class_declaration"]
range     = ["for_in_statement"]
index     = ["subscript_expression"]
global    = ["lexical_declaration", "variable_declaration"]
# Assignments that declare their names in the enclosing block.
declare   = ["variable_declarator"]
object    = ["object"]
pair      = ["pair"]
array     = ["array"]
pattern   = ["object_pattern", "array_pattern", "assignment_pattern", "rest_pattern", "pair_pattern", "object_assignment_pattern", "shorthand_property_identifier_pattern"]
await     = ["await_expression"]
spread    = ["spread_element"]
literal   = ["string", "template_string", "number"]
jsx_element = ["jsx_element"]
jsx_self_closing = ["jsx_self_closing_element"]
jsx_expression = ["jsx_expression"]
jsx_attribute = ["jsx_attribute"]
jsx_text  = ["jsx_text"]

# Child field names the flow engine reads.
[fields]
left        = ["left", "name"]
right       = ["right", "value"]
operator    = ["operator"]
condition   = ["condition"]
initializer = ["initializer"]
update      = ["increment"]
consequence = ["consequence"]
alternative = ["alternative"]
body        = ["body"]
case_label  = ["value"]
function    = ["function", "constructor"]
arguments   = ["arguments"]
operand     = ["object"]
field       = ["property"]
name        = ["name", "pattern"]
key         = ["key"]
value       = ["value"]
params      = ["parameters", "parameter"]
range       = ["right"]

[tokens]
plain_assign = ["="]
# Operators whose result is about the data but is not the data.
clear_ops    = ["==", "===", "!=", "!==", "<", "<=", ">", ">=", "instanceof", "in"]

[tests]
files  = ["*.test.*", "*.spec.*"]
dirs   = ["__tests__", "test", "tests", "e2e"]
scopes = []
